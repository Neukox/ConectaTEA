server:
  port: ${SERVER_PORT:3000}
  servlet:
    context-path: /api
spring:
  application:
    name: conectatea
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  profile-images:
    directory: ${PROFILE_IMAGE_DIRECTORY:${java.io.tmpdir}/conectatea-profile-images}
    public-base-url: ${PUBLIC_API_URL:}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT8H}
  cors:
    origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
    token-per-minute: ${RATE_LIMIT_TOKEN_PER_MINUTE:30}
    password-reset-per-minute: ${PASSWORD_RESET_RATE_LIMIT_PER_MINUTE:5}
  password-reset:
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
    frontend-url: ${FRONTEND_PASSWORD_RESET_URL:http://localhost:5173/redefinir-senha}
    async:
      core-pool-size: ${PASSWORD_RESET_ASYNC_CORE_POOL_SIZE:1}
      max-pool-size: ${PASSWORD_RESET_ASYNC_MAX_POOL_SIZE:2}
      queue-capacity: ${PASSWORD_RESET_ASYNC_QUEUE_CAPACITY:100}
  brevo:
    enabled: ${BREVO_ENABLED:false}
    sandbox: ${BREVO_SANDBOX:false}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com}
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:ConectaTEA}
    connect-timeout: ${BREVO_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${BREVO_READ_TIMEOUT:PT5S}
  notification:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      frontend-url: ${NOTIFICATION_FRONTEND_URL:http://localhost:5173}
      async:
        core-pool-size: ${NOTIFICATION_EMAIL_ASYNC_CORE_POOL_SIZE:1}
        max-pool-size: ${NOTIFICATION_EMAIL_ASYNC_MAX_POOL_SIZE:2}
        queue-capacity: ${NOTIFICATION_EMAIL_ASYNC_QUEUE_CAPACITY:200}
  consent:
    version: ${CONSENT_TERM_VERSION:1.0}
    purpose: ${CONSENT_PURPOSE:Acompanhamento terapêutico da criança}
