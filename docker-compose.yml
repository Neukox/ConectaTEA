services:
  postgres:
    image: postgres:16-alpine
    ports:
      # 5433 evita conflito com instalações locais do PostgreSQL no Windows.
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-conectatea}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-conectatea-dev-only}
      POSTGRES_DB: conectatea
    volumes:
      - conectatea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-java:
    build: ./BackendJava
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/conectatea
      DATABASE_USERNAME: ${DATABASE_USERNAME:-conectatea}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-conectatea-dev-only}
      # Conveniência exclusiva do ambiente local. Em outros ambientes, defina
      # JWT_SECRET explicitamente com um segredo forte e exclusivo.
      JWT_SECRET: ${JWT_SECRET:-conectatea-local-only-secret-change-before-production}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  conectatea-db-data:
