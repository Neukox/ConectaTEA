name: CI
on:
  push:
  pull_request:

jobs:
  backend-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
        working-directory: BackendJava

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: npm run lint
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conectatea
          POSTGRES_PASSWORD: conectatea-e2e
          POSTGRES_DB: conectatea_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conectatea -d conectatea_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar frontend
        run: npm ci
        working-directory: Frontend

      - name: Instalar Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
        working-directory: E2E

      - name: Subir backend Java
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/conectatea_e2e
          DATABASE_USERNAME: conectatea
          DATABASE_PASSWORD: conectatea-e2e
          JWT_SECRET: conectatea-e2e-secret-2026-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FRONTEND_ORIGINS: http://127.0.0.1:5173
          COOKIE_SECURE: "false"
          RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
          RATE_LIMIT_TOKEN_PER_MINUTE: "1000"
        run: |
          nohup ./mvnw spring-boot:run > ../backend-e2e.log 2>&1 &
        working-directory: BackendJava

      - name: Aguardar backend
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-e2e.log || true
          exit 1

      - name: Validar OpenAPI e Swagger UI
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/v3/api-docs -o openapi.json
          jq -e '.openapi and .info and .paths and .components.securitySchemes.cookieAuth' openapi.json > /dev/null
          curl --fail --silent http://127.0.0.1:3000/api/swagger-ui/index.html > /dev/null

      - name: Subir frontend
        env:
          VITE_API_URL: http://127.0.0.1:3000/api
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../frontend-e2e.log 2>&1 &
        working-directory: Frontend

      - name: Aguardar frontend
        run: |
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat frontend-e2e.log || true
          exit 1

      - name: Executar E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_URL: http://127.0.0.1:3000/api
          E2E_DATABASE_URL: postgresql://conectatea:conectatea-e2e@127.0.0.1:5432/conectatea_e2e
        run: npm run test:e2e
        working-directory: E2E

      - name: Exibir logs em falha
        if: failure()
        run: |
          echo "===== BACKEND ====="
          tail -n 400 backend-e2e.log || true
          echo "===== FRONTEND ====="
          tail -n 250 frontend-e2e.log || true

      - name: Publicar artefatos Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            E2E/playwright-report
            E2E/test-results
            backend-e2e.log
            frontend-e2e.log
          if-no-files-found: ignore
          retention-days: 7
